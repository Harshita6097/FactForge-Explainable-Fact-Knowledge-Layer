services:
  - type: web
    name: factforge-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: >
      pip install -r requirements.txt &&
      python -m spacy download en_core_web_sm &&
      python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: factforge.db
      - key: UPLOAD_DIR
        value: uploads
      - key: FAISS_INDEX_DIR
        value: faiss_index
      - key: MAX_BATCH_SIZE
        value: "5"
      - key: CORS_ORIGINS
        value: https://your-frontend.vercel.app
    disk:
      name: factforge-data
      mountPath: /opt/render/project/src/backend
      sizeGB: 1
